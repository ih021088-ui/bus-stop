<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7790 버스 혼잡도</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Noto Sans KR', Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; }

        header {
            background: #03C75A;
            color: white;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        header h1 { font-size: 18px; font-weight: 700; }

        .main { flex: 1; display: flex; overflow: hidden; }

        #map { flex: 1; min-height: 0; height: 100%; }

        .sidebar {
            width: 300px;
            background: #fff;
            overflow-y: auto;
            border-left: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 14px 16px;
            border-bottom: 1px solid #e0e0e0;
            background: #f8f9fa;
        }
        .sidebar-header label { font-size: 12px; color: #777; display: block; margin-bottom: 6px; }
        .sidebar-header select {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            background: #fff;
        }

        .section-label {
            padding: 12px 16px 6px;
            font-size: 11px;
            font-weight: 700;
            color: #999;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .stop-card {
            padding: 14px 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.1s;
        }
        .stop-card:hover { background: #f5f5f5; }

        .stop-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; color: #222; }

        .stop-meta {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .boarding { font-size: 13px; color: #555; }
        .boarding b { color: #222; }

        .badge {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }
        .badge-여유 { background: #e8f5e9; color: #2e7d32; }
        .badge-보통 { background: #fff3e0; color: #e65100; }
        .badge-혼잡 { background: #ffebee; color: #c62828; }
        .stop-card-inactive { opacity: 0.4; pointer-events: none; }
        .stop-card-inactive .stop-name { color: #888; }

        .arrival-info {
            margin-top: 6px;
            font-size: 12px;
            color: #1565c0;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .arrival-info.none { color: #aaa; }

        .refresh-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.6);
            color: white;
            padding: 6px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 13px;
        }
        .refresh-btn:hover { background: rgba(255,255,255,0.35); }

        #current-time { font-size: 13px; opacity: 0.9; }

        .loading {
            text-align: center;
            padding: 30px;
            color: #999;
            font-size: 13px;
        }

        /* Leaflet 마커 컨테이너가 내용을 clip하지 않도록 */
        .leaflet-marker-icon { overflow: visible; }
        .leaflet-div-icon { background: none; border: none; }

        /* 모바일 대응 */
        @media (max-width: 640px) {
            header { padding: 8px 14px; }
            header h1 { font-size: 15px; }
            #weather-info { display: none !important; }
            .main { flex-direction: column; }
            #map { flex: none; height: 42vh; }
            .sidebar {
                width: 100%;
                height: 58vh;
                border-left: none;
                border-top: 1px solid #e0e0e0;
            }
            .stop-card { padding: 10px 14px; }
        }
    </style>
</head>
<body>

<header>
    <h1>🚌 7790 버스 혼잡도</h1>
    <div style="display:flex; align-items:center; gap:14px;">
        <div id="weather-info" style="display:none; align-items:center; gap:8px; background:rgba(255,255,255,0.15); padding:5px 12px; border-radius:20px; font-size:13px;">
            <span id="weather-icon"></span>
            <span id="weather-temp"></span>
            <span id="weather-precip" style="opacity:0.85;"></span>
            <span id="data-source" style="font-size:11px; font-weight:700; margin-left:4px;"></span>
        </div>
        <span id="current-time"></span>
        <button class="refresh-btn" onclick="refreshData()">새로고침</button>
    </div>
</header>

<div class="main">
    <div id="map"></div>
    <div class="sidebar">
        <div class="sidebar-header">
            <label>시간대 선택</label>
            <select id="hour-select" onchange="refreshData()">
                <optgroup label="등교 방향 (사당→수원대)">
                    <option value="7">07시</option>
                    <option value="8">08시</option>
                    <option value="9">09시</option>
                    <option value="10">10시</option>
                </optgroup>
                <optgroup label="하교 방향 (수원대→사당)">
                    <option value="13">13시</option>
                    <option value="14">14시</option>
                    <option value="15">15시</option>
                    <option value="16">16시</option>
                    <option value="17">17시</option>
                    <option value="18">18시</option>
                </optgroup>
            </select>
        </div>

        <div id="depart-section">
            <div class="section-label">하교 방향 (수원대 → 사당)</div>
            <div id="depart-stops"><div class="loading">로딩 중...</div></div>
        </div>

        <div id="arrive-section">
            <div class="section-label">등교 방향 (사당 → 수원대)</div>
            <div id="arrive-stops"><div class="loading">로딩 중...</div></div>
        </div>
    </div>
</div>

<script>
const API_BASE = 'https://052ee478679dd96e-223-195-111-38.serveousercontent.com';

// ── 정류장 정보 ───────────────────────────────────────────────────────
const STOPS = {
    depart: [
        { name: '효행초등학교정문', lat: 37.2160, lng: 126.9691, stationId: '233002245' },
        { name: '아이파크정문',    lat: 37.2138, lng: 126.9707, stationId: '233002371' },
        { name: '신명아파트',      lat: 37.2136, lng: 126.9722, stationId: '233002255' },
        { name: '수원대입구',      lat: 37.2143, lng: 126.9779, stationId: '233003021' },
    ],
    arrive: [
        { name: '사당역9번출구앞', lat: 37.4776, lng: 126.9815, stationId: '119000302' },
    ],
};

const CAP_1F = 45;
const markers = {};

// ── 지도 초기화 (Leaflet + OpenStreetMap) ────────────────────────────
const map = L.map('map').setView([37.37, 126.98], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 19,
}).addTo(map);

// ── 혼잡도 판별 (서버가 status 안 줄 때 폴백용) ──────────────────────
function getCongestion(boardings) {
    const ratio = boardings / CAP_1F;
    if (ratio >= 0.8) return '혼잡';
    if (ratio >= 0.5) return '보통';
    return '여유';
}

function getColor(congestion) {
    return { '혼잡': '#e53935', '보통': '#fb8c00', '여유': '#43a047' }[congestion] || '#9e9e9e';
}

// ── 도착정보 변환 (서버 arrivals → {minutes, seats}) ─────────────────
function parseArrivals(raw) {
    const result = {};
    for (const [name, info] of Object.entries(raw || {})) {
        if (!info) { result[name] = null; continue; }
        result[name] = {
            minutes:    info.predictMin,
            seats:      info.remainSeat,
            nextBusMin: info.nextBusMin ?? null,
            busType:    info.busType ?? null,
            capacity:   info.capacity ?? null,
        };
    }
    return result;
}

// ── 도착정보 텍스트 ───────────────────────────────────────────────────
function busTypeLabel(info) {
    if (!info || info.busType == null) return '';
    if (info.busType === 2) return '2층버스 · ';
    if (info.capacity === 45) return '1층버스 · ';
    return '';
}

function arrivalText(info) {
    if (!info || info.minutes == null) return null;
    const type = busTypeLabel(info);
    const time = info.minutes <= 1 ? '곧 도착' : `${info.minutes}분 후 도착`;
    const seats = info.seats != null ? ` · 잔여 ${info.seats}석` : '';
    return type + time + seats;
}

// ── 마커 생성 (Leaflet divIcon) ──────────────────────────────────────
function createMarker(stop, boardings, status, arrival, can_board, overflow) {
    const congestion = status || getCongestion(boardings);
    const color = getColor(congestion);
    const arrTxt = arrivalText(arrival);

    if (markers[stop.name]) markers[stop.name].remove();

    const icon = L.divIcon({
        html: `
            <div style="
                display:inline-block;
                transform:translateX(-50%);
                background:${color};
                color:#fff;
                padding:6px 12px;
                border-radius:20px;
                font-size:12px;
                font-weight:700;
                white-space:nowrap;
                box-shadow:0 2px 8px rgba(0,0,0,0.25);
                cursor:pointer;
                line-height:1.6;
                text-align:center;
            ">
                ${stop.name}<br>
                <span style="font-size:11px;font-weight:400;">${boardings}명 · ${congestion}</span>
                ${arrTxt ? `<br><span style="font-size:10px;font-weight:400;opacity:0.9;">🕐 ${arrTxt}</span>` : ''}
            </div>`,
        className: '',
        iconSize: [0, 0],
        iconAnchor: [0, 20],
    });

    let demandLine;
    if (can_board !== null && can_board !== undefined) {
        demandLine = `<div style="font-size:13px; color:#555;">이번 버스 <b style="color:#222;">${can_board}명</b> 탑승 가능</div>`;
        if (overflow > 0) {
            const nextMin = arrival?.nextBusMin;
            const nextTxt = nextMin != null ? ` · 다음 버스 ${nextMin}분 후` : '';
            demandLine += `<div style="font-size:12px; color:#c62828; margin-top:2px;">⚠️ 약 <b>${overflow}명</b>은 다음 버스${nextTxt}</div>`;
        }
    } else {
        demandLine = `<div style="font-size:13px; color:#555;">예상 대기 인원: <b style="color:#222;">${boardings}명</b></div>`;
    }

    const popupContent = `
        <div style="padding:10px 12px; min-width:160px; font-family:Arial,sans-serif;">
            <div style="font-weight:700; font-size:14px; margin-bottom:6px;">${stop.name}</div>
            ${demandLine}
            <div style="font-size:13px; margin-top:4px;">혼잡도: <b style="color:${color};">${congestion}</b></div>
            ${arrTxt ? `<div style="font-size:12px; margin-top:6px; color:#1565c0;">🕐 ${arrTxt}</div>` : ''}
        </div>`;

    const marker = L.marker([stop.lat, stop.lng], { icon })
        .addTo(map)
        .bindPopup(popupContent);

    markers[stop.name] = marker;
}

// ── 사이드바 카드 렌더링 ──────────────────────────────────────────────
function renderCard(containerId, stop, info, status, arrival) {
    if (info === null) {
        const card = document.createElement('div');
        card.className = 'stop-card stop-card-inactive';
        card.innerHTML = `
            <div class="stop-name">${stop.name}</div>
            <div class="stop-meta" style="font-size:12px; color:#aaa;">이 시간대 운행 없음</div>`;
        document.getElementById(containerId).appendChild(card);
        return;
    }
    const congestion = status || getCongestion(info.predicted || 0);
    const arrTxt = arrivalText(arrival);
    const card = document.createElement('div');
    card.className = 'stop-card';

    let demandHtml;
    if (info.can_board !== null && info.can_board !== undefined) {
        demandHtml = `<span class="boarding">이번 버스 <b>${info.can_board}명</b> 탑승 가능</span>`;
        if (info.overflow > 0) {
            const nextMin = arrival?.nextBusMin;
            const nextTxt = nextMin != null ? ` · 다음 버스 ${nextMin}분 후` : '';
            demandHtml += `<div style="font-size:12px; color:#c62828; margin-top:3px;">⚠️ 약 <b>${info.overflow}명</b>은 다음 버스${nextTxt}</div>`;
        }
    } else {
        demandHtml = `<span class="boarding">예상 대기 <b>${Math.round(info.predicted || 0)}명</b></span>`;
    }

    card.innerHTML = `
        <div class="stop-name">${stop.name}</div>
        <div class="stop-meta">
            ${demandHtml}
            <span class="badge badge-${congestion}">${congestion}</span>
        </div>
        <div class="arrival-info ${arrTxt ? '' : 'none'}">
            ${arrTxt ? `🕐 ${arrTxt}` : '도착정보 없음'}
        </div>`;

    card.onclick = () => {
        map.setView([stop.lat, stop.lng], 15);
        Object.values(markers).forEach(m => m.closePopup());
        markers[stop.name]?.openPopup();
    };

    document.getElementById(containerId).appendChild(card);
}

// ── 폴백: 과거 데이터 기반 평균 ───────────────────────────────────
const FALLBACK = {
    '효행초등학교정문': { 13:5.4,  14:7.2,  15:13.4, 16:13.6, 17:11.1, 18:4.1  },
    '아이파크정문':    { 13:13.7, 14:17.7, 15:34.4, 16:30.3, 17:25.5, 18:12.4 },
    '신명아파트':      { 13:6.4,  14:6.8,  15:7.3,  16:7.7,  17:7.7,  18:5.7  },
    '수원대입구':      { 13:21.5, 14:21.6, 15:12.0, 16:11.3, 17:14.0, 18:16.9 },
    '사당역9번출구앞': { 7:56.8,  8:64.4,  9:54.1,  10:34.7 },
};

function updateWeatherUI(weather, isML) {
    if (!weather) return;
    const icon = weather.is_rainy ? '🌧️' : weather.is_cold ? '🥶' : weather.is_hot ? '🌡️' : '☀️';
    const precip = weather.is_rainy ? ` · 강수 ${weather.precip_mm}mm` : '';
    document.getElementById('weather-icon').textContent = icon;
    document.getElementById('weather-temp').textContent = `${weather.temp_avg}°C`;
    document.getElementById('weather-precip').textContent = precip;
    document.getElementById('weather-info').style.display = 'flex';
    const src = document.getElementById('data-source');
    if (src) {
        src.textContent = isML ? 'AI 예측' : '과거 평균';
        src.style.color = isML ? '#fff' : 'rgba(255,255,255,0.5)';
        src.style.fontWeight = isML ? '700' : '400';
    }
}

// ── 혼잡도 데이터 로드 (/predict API) ────────────────────────────────
// 반환값: { isServiceDay, direction, reason, stops, arrivals }
async function fetchData(hour) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 15000);
    try {
        const res = await fetch(`${API_BASE}/predict?hour=${hour}`, { signal: controller.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error('server error');
        const json = await res.json();

        // 주말·공휴일
        if (!json.is_service_day) {
            return { isServiceDay: false, direction: json.direction, reason: json.reason, stops: {}, arrivals: {} };
        }

        const firstWeather = json.stops?.[0]?.weather;
        updateWeatherUI(firstWeather, true);

        const stops = {};
        for (const s of (json.stops || [])) {
            stops[s.stop] = {
                predicted: s.predicted ?? 0,
                can_board: s.can_board ?? null,
                overflow:  s.overflow  ?? null,
                status:    s.status,
                capacity:  s.capacity,
            };
        }
        return {
            isServiceDay: true,
            direction: json.direction,
            stops,
            arrivals: parseArrivals(json.arrivals),
        };
    } catch(e) {
        clearTimeout(timer);
        console.warn('[예측 API 실패, 폴백 사용]', e.message);
        updateWeatherUI({ temp_avg: '-', precip_mm: 0, is_rainy: 0, is_cold: 0, is_hot: 0 }, false);
        const stops = {};
        for (const [name, hours] of Object.entries(FALLBACK)) {
            stops[name] = { predicted: Math.round(hours[hour] ?? 0), status: null, capacity: null };
        }
        return {
            isServiceDay: true,
            direction: hour <= 10 ? 'arrive' : 'depart',
            stops,
            arrivals: {},
        };
    }
}

function showNotServiceDay(reason) {
    const msg = `
        <div style="padding:30px 20px; text-align:center; color:#888;">
            <div style="font-size:32px; margin-bottom:12px;">${reason === '공휴일' ? '🏖️' : '🛌'}</div>
            <div style="font-size:15px; font-weight:700; color:#555; margin-bottom:6px;">${reason}입니다</div>
            <div style="font-size:13px; line-height:1.6;">
                7790 버스 예측은 평일(월~금)에만<br>제공됩니다.
            </div>
        </div>`;
    document.getElementById('depart-section').innerHTML = msg;
    document.getElementById('arrive-section').innerHTML = '';

    // 마커는 정류장 위치만 표시 (예측값 없이)
    [...STOPS.depart, ...STOPS.arrive].forEach(stop => {
        if (markers[stop.name]) markers[stop.name].remove();
        const icon = L.divIcon({
            html: `<div style="display:inline-block;transform:translateX(-50%);background:#9e9e9e;color:#fff;padding:5px 10px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.2);">${stop.name}</div>`,
            className: '',
            iconSize: [0, 0],
            iconAnchor: [0, 18],
        });
        markers[stop.name] = L.marker([stop.lat, stop.lng], { icon }).addTo(map);
    });
}

let isRefreshing = false;

async function refreshData() {
    if (isRefreshing) return;
    isRefreshing = true;
    try {
        await _doRefresh();
    } finally {
        isRefreshing = false;
    }
}

async function _doRefresh() {
    const hour = parseInt(document.getElementById('hour-select').value);
    const { isServiceDay, direction, reason, stops, arrivals } = await fetchData(hour);

    if (!isServiceDay) {
        showNotServiceDay(reason);
        return;
    }

    // 주말 메시지가 section을 덮어쓴 경우 원래 구조 복원
    if (!document.getElementById('depart-stops')) {
        document.getElementById('depart-section').innerHTML =
            '<div class="section-label">하교 방향 (수원대 → 사당)</div><div id="depart-stops"></div>';
        document.getElementById('arrive-section').innerHTML =
            '<div class="section-label">등교 방향 (사당 → 수원대)</div><div id="arrive-stops"></div>';
    }

    document.getElementById('depart-stops').innerHTML = '';
    document.getElementById('arrive-stops').innerHTML = '';

    const isArrive = direction === 'arrive';

    STOPS.depart.forEach(stop => {
        const info = isArrive ? null : (stops[stop.name] ?? null);
        const boardings = info ? Math.round(info.predicted || 0) : 0;
        const status = info ? info.status : '운행외';
        createMarker(stop, boardings, status, arrivals[stop.name] ?? null, info?.can_board, info?.overflow);
        renderCard('depart-stops', stop, info, status, arrivals[stop.name] ?? null);
    });

    STOPS.arrive.forEach(stop => {
        const info = isArrive ? (stops[stop.name] ?? null) : null;
        const boardings = info ? Math.round(info.predicted || 0) : 0;
        const status = info ? info.status : '운행외';
        createMarker(stop, boardings, status, arrivals[stop.name] ?? null, info?.can_board, info?.overflow);
        renderCard('arrive-stops', stop, info, status, arrivals[stop.name] ?? null);
    });
}

// ── 현재 시각 표시 ────────────────────────────────────────────────────
function updateTime() {
    document.getElementById('current-time').textContent =
        new Date().toLocaleString('ko-KR', {
            month: 'long', day: 'numeric',
            weekday: 'short', hour: '2-digit', minute: '2-digit',
        });
}

// ── 현재 시간과 가장 가까운 시간대 자동 선택 ─────────────────────────
function setDefaultHour() {
    const h = new Date().getHours();
    const valid = [7, 8, 9, 10, 13, 14, 15, 16, 17, 18];
    const closest = valid.reduce((a, b) => Math.abs(b - h) < Math.abs(a - h) ? b : a);
    document.getElementById('hour-select').value = closest;
}

// ── 자동 갱신 (비활성 탭에서는 중지) ────────────────────────────────
let refreshInterval = setInterval(refreshData, 30000);

document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        clearInterval(refreshInterval);
    } else {
        refreshData();
        refreshInterval = setInterval(refreshData, 30000);
    }
});

// ── 초기 실행 ─────────────────────────────────────────────────────────
setDefaultHour();
updateTime();
setInterval(updateTime, 60000);
refreshData();
</script>
</body>
</html>
